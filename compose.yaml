name: melivrei

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-melivrei}
      POSTGRES_USER: ${POSTGRES_USER:-melivrei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melivrei}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  schema:
    build:
      context: ./backend
      target: runtime
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"
    environment: &backend_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-melivrei}:${POSTGRES_PASSWORD:-melivrei}@db:5432/${POSTGRES_DB:-melivrei}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-to-a-random-secret-with-at-least-32-characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      MERCADO_PAGO_CLIENT_ID: ${MERCADO_PAGO_CLIENT_ID:-}
      MERCADO_PAGO_CLIENT_SECRET: ${MERCADO_PAGO_CLIENT_SECRET:-}
      MERCADO_PAGO_REDIRECT_URI: ${MERCADO_PAGO_REDIRECT_URI:-http://localhost:3000/api/payments/mercadopago/callback}
      MERCADO_PAGO_TOKEN_ENCRYPTION_KEY: ${MERCADO_PAGO_TOKEN_ENCRYPTION_KEY:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL:-https://your-public-domain.example/api/payments/webhook}
      MERCADO_PAGO_ENVIRONMENT: ${MERCADO_PAGO_ENVIRONMENT:-test}
      MERCADO_PAGO_SPLIT_ENABLED: ${MERCADO_PAGO_SPLIT_ENABLED:-false}
      MERCADO_PAGO_MARKETPLACE_FEE_PERCENT: ${MERCADO_PAGO_MARKETPLACE_FEE_PERCENT:-0}
      MERCADO_PAGO_SUCCESS_URL: ${MERCADO_PAGO_SUCCESS_URL:-http://localhost:3001/pagamento/sucesso}
      MERCADO_PAGO_FAILURE_URL: ${MERCADO_PAGO_FAILURE_URL:-http://localhost:3001/pagamento/falha}
      MERCADO_PAGO_PENDING_URL: ${MERCADO_PAGO_PENDING_URL:-http://localhost:3001/pagamento/pendente}
      MERCADO_PAGO_CONNECTION_RETURN_URL: ${MERCADO_PAGO_CONNECTION_RETURN_URL:-http://localhost:3001/conta/pagamentos}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      <<: *backend_environment
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/docs').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        API_URL: http://api:3000
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_LIVE_CHECKOUT: ${NEXT_PUBLIC_LIVE_CHECKOUT:-false}
        NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY:-}
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
